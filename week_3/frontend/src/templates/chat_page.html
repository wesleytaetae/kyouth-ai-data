<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Helper Chatbot</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >
    <style>
        :root {
            --chat-blue: #2563eb;
            --chat-blue-dark: #1d4ed8;
            --chat-blue-soft: #dbeafe;
            --chat-surface: rgba(255, 255, 255, 0.9);
            --chat-border: rgba(148, 163, 184, 0.28);
            --chat-shadow: 0 28px 60px rgba(37, 99, 235, 0.16);
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(96, 165, 250, 0.26), transparent 28%),
                radial-gradient(circle at top right, rgba(59, 130, 246, 0.18), transparent 24%),
                linear-gradient(180deg, #eef5ff 0%, #f8fbff 44%, #edf4ff 100%);
        }

        .chat-shell {
            max-width: 980px;
        }

        .chat-card {
            overflow: hidden;
            border: 1px solid var(--chat-border);
            border-radius: 28px;
            background: var(--chat-surface);
            box-shadow: var(--chat-shadow);
            backdrop-filter: blur(12px);
        }

        .chat-header {
            background: linear-gradient(135deg, var(--chat-blue-dark), var(--chat-blue));
            color: #fff;
        }

        .chat-header .status-pill {
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.22);
            color: rgba(255, 255, 255, 0.92);
        }

        .chat-history {
            height: 52vh;
            overflow-y: auto;
            background:
                linear-gradient(180deg, rgba(219, 234, 254, 0.45) 0%, rgba(255, 255, 255, 0.92) 18%, rgba(255, 255, 255, 0.98) 100%);
        }

        .chat-history::-webkit-scrollbar {
            width: 10px;
        }

        .chat-history::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.35);
            border-radius: 999px;
        }

        .message-row {
            display: flex;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.assistant,
        .message-row.system {
            justify-content: flex-start;
        }

        .message {
            max-width: min(78%, 620px);
            border-radius: 22px;
            padding: 0.95rem 1rem;
            border: 1px solid transparent;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
        }

        .message.user {
            background: linear-gradient(135deg, var(--chat-blue), #3b82f6);
            color: #fff;
            border-bottom-right-radius: 8px;
        }

        .message.assistant {
            background: #fff;
            color: #0f172a;
            border-color: rgba(148, 163, 184, 0.22);
            border-bottom-left-radius: 8px;
        }

        .message.system {
            background: #eff6ff;
            color: #1e3a8a;
            border-color: rgba(59, 130, 246, 0.18);
        }

        .message.system.error {
            background: #fef2f2;
            color: #991b1b;
            border-color: rgba(239, 68, 68, 0.24);
        }

        .message.system.warning {
            background: #fff7ed;
            color: #9a3412;
            border-color: rgba(249, 115, 22, 0.22);
        }

        .message-label {
            font-size: 0.75rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            opacity: 0.72;
        }

        .message pre {
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 0;
            font-family: inherit;
        }

        .composer-card {
            background: rgba(255, 255, 255, 0.88);
            border-top: 1px solid rgba(148, 163, 184, 0.2);
        }

        .composer-card .form-control {
            border-radius: 16px;
            border-color: rgba(148, 163, 184, 0.35);
        }

        .composer-card .form-control:focus {
            border-color: rgba(37, 99, 235, 0.48);
            box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.12);
        }

        .send-button {
            border-radius: 999px;
            padding-inline: 1.5rem;
            background: linear-gradient(135deg, var(--chat-blue-dark), var(--chat-blue));
            border: none;
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.22);
        }

        .send-button:hover,
        .send-button:focus {
            background: linear-gradient(135deg, #1e40af, var(--chat-blue-dark));
        }

        @media (max-width: 768px) {
            .chat-shell {
                padding-inline: 0.45rem;
            }

            .chat-history {
                height: 48vh;
            }

            .message {
                max-width: 92%;
            }
        }
    </style>
</head>
<body class="py-4">
    <main class="container chat-shell" data-backend-url="{{ backend_url }}">
        <section class="chat-card">
            <div class="chat-header p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-start gap-3 flex-wrap">
                    <div>
                        <div class="status-pill d-inline-flex align-items-center rounded-pill px-3 py-2 small mb-3">
                            AI Resume Assistant
                        </div>
                        <h1 class="h3 mb-2">Chat with your resume helper</h1>
                        <p class="mb-0 text-white-50">Ask questions, or attach a PDF or TXT resume to find your skill gaps.</p>
                    </div>
                </div>
            </div>

            <div id="chat-history" class="chat-history p-3 p-md-4 d-flex flex-column gap-3">
                <div class="message-row assistant">
                    <div class="message assistant">
                        <div class="message-label mb-1">Assistant</div>
                        <p class="mb-0">Hello! Ask me something.</p>
                    </div>
                </div>
            </div>

            <div class="composer-card p-3 p-md-4">
                <form id="chat-form" class="d-flex flex-column gap-3">
                    <div class="row g-3">
                        <div class="col-12">
                            <label for="message" class="form-label fw-semibold text-primary-emphasis">Message</label>
                            <textarea
                                id="message"
                                class="form-control"
                                rows="4"
                                placeholder="Type your message here"
                                required
                            ></textarea>
                        </div>

                        <div class="col-12 col-lg-6">
                            <label for="model" class="form-label fw-semibold text-primary-emphasis">Model</label>
                            <select id="model" class="form-select">
                                <option value="llama3.1" selected>llama3.1</option>
                                <option value="phi3">phi3</option>
                                <option value="deepseek-r1:1.5b">deepseek-r1:1.5b</option>
                                <option value="gemini-2.5-flash">gemini-2.5-flash</option>
                                <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite</option>
                                <option value="gemini-3-flash-preview">gemini-3-flash-preview</option>
                            </select>
                            <div class="form-text">Choose your preferred model.</div>
                        </div>

                        <div class="col-12 col-lg-6">
                            <label for="pdf-file" class="form-label fw-semibold text-primary-emphasis">Attach Resume File</label>
                            <input
                                id="pdf-file"
                                class="form-control"
                                type="file"
                                accept=".pdf,.txt,application/pdf,text/plain"
                            >
                            <div id="pdf-status" class="form-text">No file attached.</div>
                        </div>

                        <div class="col-12 col-lg-6">
                            <label class="form-label fw-semibold text-primary-emphasis">Backend Status</label>
                            <div id="request-status" class="form-control bg-body-tertiary d-flex align-items-center small text-body-secondary">
                                Backend URL: {{ backend_url if backend_url else "Not configured" }}
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end">
                        <button id="send-button" type="submit" class="btn btn-primary send-button">Send Message</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script type="module">
        import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";

        const backendUrl = document
            .querySelector(".chat-shell")
            .dataset.backendUrl;
        const chatForm = document.getElementById("chat-form");
        const chatHistory = document.getElementById("chat-history");
        const messageInput = document.getElementById("message");
        const modelInput = document.getElementById("model");
        const fileInput = document.getElementById("pdf-file");
        const pdfStatus = document.getElementById("pdf-status");
        const requestStatus = document.getElementById("request-status");
        const sendButton = document.getElementById("send-button");

        let pdfPayload = {
            filename: null,
            text: "",
        };

        function resetComposer() {
            messageInput.value = "";
            fileInput.value = "";
            pdfPayload = { filename: null, text: "" };
            pdfStatus.textContent = "No file attached.";
        }

        function addMessage(role, content, variant = "assistant") {
            const row = document.createElement("div");
            row.className = `message-row ${variant}`;

            const wrapper = document.createElement("div");
            wrapper.className = `message ${variant}`;

            if (variant === "error") {
                wrapper.className = "message system error";
                row.className = "message-row system";
            }

            if (variant === "warning") {
                wrapper.className = "message system warning";
                row.className = "message-row system";
            }

            if (variant === "system") {
                row.className = "message-row system";
            }

            const title = document.createElement("div");
            title.className = "message-label mb-1";
            title.textContent = role;

            const body = document.createElement("pre");
            body.textContent = content;

            wrapper.append(title, body);
            row.appendChild(wrapper);
            chatHistory.appendChild(row);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function extractPdfText(file) {
            const bytes = new Uint8Array(await file.arrayBuffer());
            const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
            const pages = [];

            for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
                const page = await pdf.getPage(pageNumber);
                const content = await page.getTextContent();
                const pageText = content.items.map((item) => item.str).join(" ");
                pages.push(pageText.trim());
            }

            return pages.filter(Boolean).join("\n\n");
        }

        async function extractFileText(file) {
            const lowerName = file.name.toLowerCase();

            if (lowerName.endsWith(".pdf") || file.type === "application/pdf") {
                return extractPdfText(file);
            }

            if (lowerName.endsWith(".txt") || file.type.startsWith("text/")) {
                return file.text();
            }

            throw new Error("Only PDF and TXT files are supported.");
        }

        fileInput.addEventListener("change", async (event) => {
            const [file] = event.target.files;

            if (!file) {
                pdfPayload = { filename: null, text: "" };
                pdfStatus.textContent = "No file attached.";
                return;
            }

            pdfStatus.textContent = `Reading ${file.name}...`;

            try {
                const extractedText = await extractFileText(file);
                pdfPayload = {
                    filename: file.name,
                    text: extractedText,
                };
                pdfStatus.textContent = `Attached ${file.name}. Extracted ${extractedText.length} characters.`;
            } catch (error) {
                pdfPayload = { filename: null, text: "" };
                fileInput.value = "";
                pdfStatus.textContent = "Could not read that file.";
                addMessage("System", `File processing failed: ${error.message}`, "warning");
            }
        });

        chatForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const message = messageInput.value.trim();
            if (!message) {
                return;
            }

            if (!backendUrl) {
                addMessage("System", "BACKEND_URL is not configured. Add it to your .env file first.", "error");
                requestStatus.textContent = "Missing BACKEND_URL";
                return;
            }

            const payload = {
                message,
                model: modelInput.value,
                pdf_filename: pdfPayload.filename,
                pdf_text: pdfPayload.text,
            };

            addMessage("You", `${message}\n`, "user");
            if (pdfPayload.filename) {
                addMessage(
                    "System",
                    `Attached file: ${pdfPayload.filename}\n\n${pdfPayload.text || "No text extracted."}`,
                    "system"
                );
            }

            requestStatus.textContent = `Sending request to backend with ${modelInput.value}...`;
            sendButton.disabled = true;

            try {
                const response = await fetch(backendUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify(payload),
                });

                const contentType = response.headers.get("content-type") || "";
                let responseBody = "";

                if (contentType.includes("application/json")) {
                    const data = await response.json();
                    responseBody = data.reply || data.message || JSON.stringify(data, null, 2);
                } else {
                    responseBody = await response.text();
                }

                if (!response.ok) {
                    throw new Error(`Backend returned ${response.status}: ${responseBody}`);
                }

                addMessage("Assistant", responseBody || "Request sent successfully.", "assistant");
                requestStatus.textContent = `Sent to ${backendUrl} using ${modelInput.value}`;
            } catch (error) {
                addMessage("System", `Request failed: ${error.message}`, "error");
                requestStatus.textContent = `Could not reach ${backendUrl}`;
            } finally {
                resetComposer();
                sendButton.disabled = false;
            }
        });
    </script>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"
    ></script>
</body>
</html>
