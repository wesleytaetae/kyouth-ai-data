<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Helper Chatbot</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >
    <style>
        body {
            background: #f3f4f6;
        }

        .chat-shell {
            max-width: 900px;
        }

        .chat-history {
            height: 55vh;
            overflow-y: auto;
            background: #ffffff;
        }

        .message {
            max-width: 85%;
        }

        .message pre {
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 0;
            font-family: inherit;
        }
    </style>
</head>
<body class="py-4">
    <main class="container chat-shell" data-backend-url="{{ backend_url }}">
        <section class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="mb-4">
                    <h1 class="h3 mb-1">Resume Helper Chatbot</h1>
                    <p class="text-body-secondary mb-0">Send a message and optionally attach a PDF to include its extracted text.</p>
                </div>

                <div id="chat-history" class="chat-history border rounded-3 p-3 mb-3 d-flex flex-column gap-3">
                    <div class="message bg-light border rounded-3 p-3">
                        <strong class="d-block mb-1">Assistant</strong>
                        <p class="mb-0">Hello! Ask me something.</p>
                    </div>
                </div>

                <form id="chat-form" class="d-flex flex-column gap-3">
                    <div>
                        <label for="message" class="form-label">Message</label>
                        <textarea
                            id="message"
                            class="form-control"
                            rows="4"
                            placeholder="Type your message here"
                            required
                        ></textarea>
                    </div>

                    <div>
                        <label for="pdf-file" class="form-label">Attach PDF</label>
                        <input
                            id="pdf-file"
                            class="form-control"
                            type="file"
                            accept="application/pdf"
                        >
                        <div id="pdf-status" class="form-text">No PDF attached.</div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap">
                        <div id="request-status" class="text-body-secondary small">
                            Backend URL: {{ backend_url if backend_url else "Not configured" }}
                        </div>
                        <button id="send-button" type="submit" class="btn btn-primary px-4">Send</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script type="module">
        import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";

        const backendUrl = document
            .querySelector(".chat-shell")
            .dataset.backendUrl;
        const chatForm = document.getElementById("chat-form");
        const chatHistory = document.getElementById("chat-history");
        const messageInput = document.getElementById("message");
        const fileInput = document.getElementById("pdf-file");
        const pdfStatus = document.getElementById("pdf-status");
        const requestStatus = document.getElementById("request-status");
        const sendButton = document.getElementById("send-button");

        let pdfPayload = {
            filename: null,
            text: "",
        };

        function addMessage(role, content, toneClass) {
            const wrapper = document.createElement("div");
            wrapper.className = `message border rounded-3 p-3 ${toneClass}`;

            const title = document.createElement("strong");
            title.className = "d-block mb-1";
            title.textContent = role;

            const body = document.createElement("pre");
            body.textContent = content;

            wrapper.append(title, body);
            chatHistory.appendChild(wrapper);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function extractPdfText(file) {
            const bytes = new Uint8Array(await file.arrayBuffer());
            const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
            const pages = [];

            for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
                const page = await pdf.getPage(pageNumber);
                const content = await page.getTextContent();
                const pageText = content.items.map((item) => item.str).join(" ");
                pages.push(pageText.trim());
            }

            return pages.filter(Boolean).join("\n\n");
        }

        fileInput.addEventListener("change", async (event) => {
            const [file] = event.target.files;

            if (!file) {
                pdfPayload = { filename: null, text: "" };
                pdfStatus.textContent = "No PDF attached.";
                return;
            }

            pdfStatus.textContent = `Reading ${file.name}...`;

            try {
                const extractedText = await extractPdfText(file);
                pdfPayload = {
                    filename: file.name,
                    text: extractedText,
                };
                pdfStatus.textContent = `Attached ${file.name}. Extracted ${extractedText.length} characters.`;
            } catch (error) {
                pdfPayload = { filename: null, text: "" };
                fileInput.value = "";
                pdfStatus.textContent = "Could not read that PDF.";
                addMessage("System", `PDF processing failed: ${error.message}`, "bg-warning-subtle");
            }
        });

        chatForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const message = messageInput.value.trim();
            if (!message) {
                return;
            }

            if (!backendUrl) {
                addMessage("System", "BACKEND_URL is not configured. Add it to your .env file first.", "bg-danger-subtle");
                requestStatus.textContent = "Missing BACKEND_URL";
                return;
            }

            const payload = {
                message,
                pdf_filename: pdfPayload.filename,
                pdf_text: pdfPayload.text,
            };

            addMessage("You", message, "bg-primary-subtle");
            if (pdfPayload.filename) {
                addMessage(
                    "System",
                    `Attached PDF: ${pdfPayload.filename}\n\n${pdfPayload.text || "No text extracted."}`,
                    "bg-light"
                );
            }

            requestStatus.textContent = "Sending request to backend...";
            sendButton.disabled = true;

            try {
                const response = await fetch(backendUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify(payload),
                });

                const contentType = response.headers.get("content-type") || "";
                let responseBody = "";

                if (contentType.includes("application/json")) {
                    const data = await response.json();
                    responseBody = data.reply || data.message || JSON.stringify(data, null, 2);
                } else {
                    responseBody = await response.text();
                }

                if (!response.ok) {
                    throw new Error(`Backend returned ${response.status}: ${responseBody}`);
                }

                addMessage("Assistant", responseBody || "Request sent successfully.", "bg-success-subtle");
                requestStatus.textContent = `Sent to ${backendUrl}`;
                messageInput.value = "";
            } catch (error) {
                addMessage("System", `Request failed: ${error.message}`, "bg-danger-subtle");
                requestStatus.textContent = `Could not reach ${backendUrl}`;
            } finally {
                sendButton.disabled = false;
            }
        });
    </script>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"
    ></script>
</body>
</html>
