services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - backend

  backend:
    build:
      context: ..
      dockerfile: week_3/backend/Dockerfile
    env_file:
      - .env
    environment:
      ALLOWED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
